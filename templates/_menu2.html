<header class="navbar bg- text-light  shadow">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
       <div class="">
    <a href="{{ url_for('index') }}" class="d-flex align-items-center text-decoration-none text-white">
      <img src="{{ url_for('static', filename='img/logo1-pcam.png') }}" 
           alt="Logo" width="65" height="65" class="me-2">
      <h3 class="logo-titulo mb-0">PCAM  IA</h3>
    </a>
        </div>

      {% if session.get('nombre_usuario') %}
      <details class="position-relative">
        <summary class="btn btn-secondary">
          Bienvenid@, {{ session.get('nombre_usuario') }}
        </summary>
        <div class="card shadow-sm position-absolute end-0 mt-2 p-2 " style="z-index: 10;">
          <a href="{{ url_for('cerrar_sesion') }}" class="btn btn-outline-white btn-sm btn-secondary">
            Cerrar sesion
          </a>
        </div>
      </details>
      {% else %}
      <a href="{{ url_for('login') }}" class="text-white text-decoration-none">Iniciar sesion</a>
      {% endif %}
  </div>
</header>
